[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Vendored verifier code is kept as emitted. ecrecover malleability is harmless here: the
# signature is never used as an id (reports are deduplicated by keccak256(publicValues)). The
# decoder reverts on truncated input from inside its read loops by design.
ignore = ["src/vendors/sp1/v6_1_0/**", "src/vendors/openvm/**"]
exclude_lints = ["ecrecover", "require-revert-in-loop", "mixed-case-function", "mixed-case-variable", "screaming-snake-case-immutable", "asm-keccak256"]

[fmt]
ignore = ["src/vendors/**", "lib/**"]
