[package]
name = "equinox-openvm-server"
description = "HTTP server: lab report PDF (optionally with its TLSNotary attestation) in, OpenVM STARK proof of the extracted values out"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
equinox-core = { path = "../core", features = ["std", "serde", "k256", "json"] }
# No jemalloc feature: keeps the system allocator.
openvm-sdk = { version = "2.1.0", default-features = false, features = ["parallel"] }
openvm-sdk-config = { version = "2.1.0", default-features = false }
openvm-stark-backend = { version = "2.1.0", default-features = false }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
openvm-platform = { version = "2.1.0", default-features = false }
